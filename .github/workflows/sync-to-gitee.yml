name: Sync to Gitee

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'IPTV.txt'

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v3
        with:
          fetch-depth: 0

      - name: Push to Gitee
        run: |
          git remote add gitee https://oauth2:${{ secrets.GITEE_TOKEN }}@gitee.com/maodifang/iptv.git
          git push gitee main:main --force
