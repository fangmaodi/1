name: Update Zhibo88 Live

on:
  schedule:
    - cron: '*/20 0-17 * * *'
  workflow_dispatch:

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v3

      - name: Fetch live streams
        run: python3 grab_live.py --all-lines --out-txt zhibo88_live.txt --out-m3u zhibo88_live.m3u

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add zhibo88_live.txt zhibo88_live.m3u
          git diff --cached --quiet || git commit -m "auto: update zhibo88 live"
          git push
