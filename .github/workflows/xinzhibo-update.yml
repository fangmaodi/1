name: Update Xinzhibo Live

on:
  schedule:
    - cron: '*/30 0-1,8-23 * * *'
  workflow_dispatch:

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v3
      - name: Fetch live streams
        run: python3 grab_live.py --all-lines --out-txt xinzhibo_live.txt --out-m3u xinzhibo_live.m3u
      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add xinzhibo_live.txt xinzhibo_live.m3u
          git diff --cached --quiet || git commit -m "auto: update xinzhibo live"
          git push
