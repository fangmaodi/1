name: Extract Upload
on:
  workflow_dispatch:
jobs:
  extract:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3
        with:
          persist-credentials: true
      - name: Extract zip and commit files
        run: |
          unzip -o iptv_auto.zip
          shopt -s dotglob
          mv iptv_auto/* .
          rmdir iptv_auto
          rm -f iptv_auto.zip
          rm -f .github/workflows/extract.yml
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add -A
          git commit -m "解压上传 IPTV 自动更新文件" || echo "无需提交"
          git push origin main || echo "推送失败"
